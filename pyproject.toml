[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["snowline*"]

[project]
name = "snowline-agents"
version = "0.1.0a1"
description = "Portable Agentic OS - Companion layer for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "UsmanAzizz", email = "usman@example.com"}
]
keywords = ["ai", "agents", "llm", "safety", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/UsmanAzizz/snowline-agent-tools"
Documentation = "https://github.com/UsmanAzizz/snowline-agent-tools/blob/main/docs"
Repository = "https://github.com/UsmanAzizz/snowline-agent-tools"
Issues = "https://github.com/UsmanAzizz/snowline-agent-tools/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "mypy>=1.0",
]
